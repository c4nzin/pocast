spring.application.name=creator-service
spring.main.web-application-type=none
spring.threads.virtual.enabled=true

spring.rabbitmq.addresses=${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
spring.rabbitmq.listener.simple.prefetch=${CREATOR_PREFETCH:32}
spring.rabbitmq.listener.simple.concurrency=${CREATOR_CONCURRENCY_MIN:4}
spring.rabbitmq.listener.simple.max-concurrency=${CREATOR_CONCURRENCY_MAX:32}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.datasource.hikari.maximum-pool-size=${CREATOR_DB_POOL_MAX:20}

spring.flyway.enabled=${CREATOR_MIGRATE_ON_START:false}

pocast.creator.queue=creator_queue
pocast.creator.database-url=${CREATOR_DATABASE_URL:}
pocast.creator.media.bucket=${MEDIA_BUCKET:pocast-media}
pocast.creator.media.region=${MEDIA_REGION:us-east-1}
pocast.creator.media.endpoint=${MEDIA_S3_ENDPOINT:}
pocast.creator.media.access-key-id=${MEDIA_ACCESS_KEY_ID:}
pocast.creator.media.secret-access-key=${MEDIA_SECRET_ACCESS_KEY:}
pocast.creator.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
pocast.creator.media.max-upload-bytes=${MEDIA_MAX_UPLOAD_BYTES:524288000}
pocast.creator.media.upload-url-ttl=15m
pocast.creator.feed.public-base-url=${FEED_PUBLIC_BASE_URL:http://localhost:3000/api}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
